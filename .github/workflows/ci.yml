# CI: unit tests + lint on macOS (arm64) and Windows (x64) on every push to
# main; unsigned bundles (.dmg / NSIS .exe) — and, for tags, a GitHub Release —
# only for version tags (v*) or a
# manual run — owner decision 2026-10-12 to limit billed Actions minutes
# (private repo; macOS minutes count 10x). A manual run can be limited to one
# platform (input `platform`), e.g. the Windows installer only.
# No real credentials: the real-server harness is local-only and never runs here.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platform:
        description: "Platforms to test and bundle"
        type: choice
        options: [both, windows, macos]
        default: both

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.platform || 'push' }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.platform == 'windows' && '["windows-latest"]' || github.event_name == 'workflow_dispatch' && inputs.platform == 'macos' && '["macos-14"]' || '["macos-14","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Fetch and verify sing-box + rule-sets
        run: npm run fetch-core
      - name: Rust tests
        # --no-fail-fast: report every failing test binary in one run.
        run: cargo test --workspace --no-fail-fast
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Frontend lint
        run: npm run lint
      - name: TypeScript check
        run: npx tsc --noEmit -p .
      - name: Windows helper service end to end (install, verify from the app, uninstall)
        if: runner.os == 'Windows'
        shell: powershell
        # The runner is elevated, so the installer runs without UAC. This checks the
        # real service + pipe + the app's SCM-based server verification (round 2,
        # F-3). It cannot reproduce a non-elevated user's process-access denial.
        run: |
          cargo build -p edge-helper -p edge-app
          if ($LASTEXITCODE) { exit 1 }
          $sid = ([Security.Principal.WindowsIdentity]::GetCurrent()).User.Value
          $sb = (Get-ChildItem src-tauri\binaries -Filter 'sing-box-*.exe' | Select-Object -First 1).FullName
          & target\debug\edge-helper.exe install --sid $sid --sing-box $sb --rules resources\rules
          if ($LASTEXITCODE) { exit 1 }
          Start-Sleep -Seconds 3
          & target\debug\edge-app.exe --helper-status
          $ok = $LASTEXITCODE
          & target\debug\edge-helper.exe uninstall
          $un = $LASTEXITCODE
          if (Get-Service io.github.mosb2bls.edgeclient.helper -ErrorAction SilentlyContinue) { Write-Output 'service still present'; exit 1 }
          if ($ok -ne 0 -or $un -ne 0) { exit 1 }
      - name: Windows test scripts run (snapshot + compare, exit check)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\windows\net-snapshot.ps1 -Out "$env:RUNNER_TEMP\snap-a.json"
          if ($LASTEXITCODE) { exit 1 }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\windows\net-snapshot.ps1 -Out "$env:RUNNER_TEMP\snap-b.json" -Compare "$env:RUNNER_TEMP\snap-a.json"
          # 3 = a section differed between two runs seconds apart (possible on a
          # CI runner); only a script error (exit 1) fails this step.
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3) { exit 1 }
          # exit-check.ps1: baseline + compare must say "exit=same" (same runner, direct).
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\windows\exit-check.ps1 -Via direct -SaveBaseline -Dir "$env:RUNNER_TEMP"
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File scripts\windows\exit-check.ps1 -Via direct -Dir "$env:RUNNER_TEMP"
          Write-Output $out
          if ("$out" -notmatch 'exit=same') { exit 1 }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\windows\exit-check.ps1 -Via system -Dir "$env:RUNNER_TEMP"
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\windows\exit-check.ps1 -Via system -Cn
          exit 0

  bundle-macos:
    needs: test
    if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && (github.event_name != 'workflow_dispatch' || inputs.platform != 'windows')
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Build unsigned .dmg
        run: npm run bundle:mac
      - uses: actions/upload-artifact@v7
        with:
          name: Lynnk-macos-arm64-${{ github.sha }}
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  bundle-windows:
    needs: test
    if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && (github.event_name != 'workflow_dispatch' || inputs.platform != 'macos')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Build unsigned NSIS installer
        run: npm run bundle:win
      - uses: actions/upload-artifact@v7
        with:
          name: Lynnk-windows-x64-${{ github.sha }}
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # Version tags (v*): publish a GitHub Release with both installers, their
  # SHA-256 sums and docs/releases/<tag>.md as the notes.
  release:
    needs: [bundle-macos, bundle-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find dist -type f \( -name '*.dmg' -o -name '*.exe' \) | sort)
          [ "${#files[@]}" -eq 2 ] || { echo "expected 2 installers, found ${#files[@]}"; exit 1; }
          for f in "${files[@]}"; do (cd "$(dirname "$f")" && sha256sum "$(basename "$f")"); done > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" "${files[@]}" SHA256SUMS.txt \
            --title "Lynnk $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md" --verify-tag
