[package]
name = "edge-harness"
description = "Local-only real-server test harness (prints redacted results only)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "edge-harness"
path = "src/main.rs"

# macOS only (local real-server testing). On Windows, depending on the Tauri
# app crate breaks linking (tauri-build link args), so the harness is a stub.
[target.'cfg(target_os = "macos")'.dependencies]
edge-core.workspace = true
edge-app = { path = "../../src-tauri" }
tempfile = "3"
serde_json.workspace = true
