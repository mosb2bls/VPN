[package]
name = "edge-app"
description = "Desktop client UI process (Tauri)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519).
name = "edge_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
edge-core = { workspace = true, features = ["specta"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta.workspace = true
specta-typescript = "=0.0.12"
thiserror = "2"
tauri-plugin-clipboard-manager = "2"
keyring-core = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1", default-features = false }

[dev-dependencies]
tempfile = "3"
