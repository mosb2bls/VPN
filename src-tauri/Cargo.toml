[package]
name = "edge-app"
description = "Desktop client UI process (Tauri)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519).
name = "edge_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
edge-core = { workspace = true, features = ["specta"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta.workspace = true
specta-typescript = "=0.0.12"
thiserror = "2"
tauri-plugin-clipboard-manager = "2"
keyring-core = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls", "socks-proxy", "json"] }
percent-encoding = "2"
tokio = { version = "1", features = ["sync", "time"] }
libc = "0.2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Tray icons: decode the 44 px template PNGs; size the menu-bar image to 22 pt.
png = "0.17"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSResponder", "NSImage"] }
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Tray icons: pick the 16/20/24/32 px frame of the tray ICOs.
ico = "0.5"
edge-winsys = { path = "../crates/winsys" }
windows-native-keyring-store = { version = "1", default-features = false }

[dev-dependencies]
tempfile = "3"
