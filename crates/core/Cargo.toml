[package]
name = "edge-core"
description = "Pure-Rust core: link parsing, config generation, rules, DNS, failover logic, redaction"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Derive `specta::Type` for types that cross the UI boundary (enabled by edge-app).
specta = ["dep:specta"]

[dependencies]
base64 = "0.22"
percent-encoding = "2"
serde.workspace = true
specta = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
